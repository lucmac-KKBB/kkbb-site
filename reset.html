<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nouveau mot de passe — KKBB</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f0e4;--ink:#1c1712;--coral:#f0442e;--sun:#ffcf3f;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;line-height:1.5;display:grid;place-items:center;min-height:100vh;padding:24px}
.card{width:100%;max-width:420px}
.logo{font-family:'Bricolage Grotesque';font-weight:800;font-size:17px;letter-spacing:-.5px;color:var(--coral);text-decoration:none;display:block;margin-bottom:26px}
.logo b{color:var(--ink)}
h1{font-family:'Bricolage Grotesque';font-weight:800;font-size:34px;letter-spacing:-1px;line-height:1.05;margin:0 0 20px}
label{display:block;font-weight:600;font-size:13px;margin:0 0 7px}
input{width:100%;background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:14px 15px;font-family:'Space Grotesk';font-size:15px;color:var(--ink);margin-bottom:14px}
button{width:100%;background:var(--coral);color:#fff;border:2px solid var(--ink);border-radius:16px;padding:16px;font-family:'Bricolage Grotesque';font-weight:800;font-size:15px;letter-spacing:.5px;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:transform .08s}
button:active{transform:translateY(2px)}
button:disabled{background:#f3ede1;cursor:not-allowed;box-shadow:3px 3px 0 var(--ink)}
.msg{border:2px solid var(--ink);border-radius:16px;padding:14px 16px;font-size:14px;margin-bottom:16px;box-shadow:3px 3px 0 var(--ink)}
.ok{background:var(--sun)}
.err{background:#fff;color:var(--coral);font-weight:600}
.hint{font-size:13px;color:rgba(28,23,18,.6);margin-top:16px;text-align:center}
.hidden{display:none}
</style>
</head>
<body>
<div class="card">
  <a class="logo" href="/">kisskiss<b>boomboom</b></a>

  <div id="loading">
    <h1>Un instant…</h1>
    <p class="hint">Vérification du lien.</p>
  </div>

  <div id="invalid" class="hidden">
    <h1>Lien expiré</h1>
    <div class="msg err">
      Ce lien n'est plus valable. Demande-en un nouveau depuis l'application.
    </div>
  </div>

  <div id="form" class="hidden">
    <h1>Nouveau mot de passe</h1>
    <div id="error" class="msg err hidden"></div>
    <label for="pw">Mot de passe (8 caractères minimum)</label>
    <input id="pw" type="password" autocomplete="new-password" minlength="8">
    <label for="pw2">Confirme-le</label>
    <input id="pw2" type="password" autocomplete="new-password" minlength="8">
    <button id="submit">ENREGISTRER</button>
  </div>

  <div id="done" class="hidden">
    <h1>C'est fait 💋</h1>
    <div class="msg ok">
      Ton mot de passe est changé. Retourne dans l'application pour te connecter.
    </div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://qnhzwlaogsdudtxovoga.supabase.co';
// Clé anon : publique par nature, protégée par les règles RLS côté base.
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFuaHp3bGFvZ3NkdWR0eG92b2dhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ1MTM4NDUsImV4cCI6MjA5MDA4OTg0NX0.cfa8FAaE2vRpQVn5KkbXtVz7sXSg__TRnHWXxClwqGY';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON, {
  auth: { detectSessionInUrl: true, flowType: 'implicit' },
});

const show = (id) => document.getElementById(id).classList.remove('hidden');
const hide = (id) => document.getElementById(id).classList.add('hidden');

function showError(text) {
  const box = document.getElementById('error');
  box.textContent = text;
  box.classList.remove('hidden');
}

// Supabase place le jeton dans le fragment d'URL et ouvre une session temporaire.
supabase.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY' || session) {
    hide('loading');
    show('form');
  }
});

// Si rien ne se passe au bout de 3 secondes, le lien est invalide ou périmé.
setTimeout(async () => {
  const { data } = await supabase.auth.getSession();
  if (!data.session) {
    hide('loading');
    show('invalid');
  }
}, 3000);

document.getElementById('submit').addEventListener('click', async () => {
  const pw = document.getElementById('pw').value;
  const pw2 = document.getElementById('pw2').value;
  const btn = document.getElementById('submit');

  document.getElementById('error').classList.add('hidden');

  if (pw.length < 8) return showError('Le mot de passe doit faire au moins 8 caractères.');
  if (pw !== pw2) return showError('Les deux mots de passe ne correspondent pas.');

  btn.disabled = true;
  btn.textContent = 'ENREGISTREMENT…';

  const { error } = await supabase.auth.updateUser({ password: pw });

  if (error) {
    btn.disabled = false;
    btn.textContent = 'ENREGISTRER';
    return showError(error.message);
  }

  await supabase.auth.signOut();
  hide('form');
  show('done');
});
</script>
</body>
</html>
